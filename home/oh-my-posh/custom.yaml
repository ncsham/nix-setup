# Oh My Posh theme: path, kubectl, time, execution time
# Schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 2
tooltips_action: extend
tooltips:
  - type: git
    tips: [git, g]
    style: plain
    foreground: "#f8bbd9"
    template: " {{ .HEAD }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}"
    properties:
      fetch_status: true
      fetch_upstream_icon: true
  - type: aws
    tips: [aws, terraform, tf]
    style: plain
    foreground: "#ffcc66"
    template: " {{.Profile}}{{if .Region}}@{{.Region}}{{end}}"
blocks:
  - alignment: left
    segments:
      - type: path
        style: plain
        foreground: "#ffff00"
        template: "<#dda0dd>.-(</#dda0dd><#00ff00>{{ .Path }}</><#dda0dd>)</>"
        properties:
          style: agnoster_full
    type: prompt
  - alignment: right
    filler: "<#dda0dd>-</>"
    segments:
      - type: kubectl
        style: plain
        foreground: "#00bfff"
        template: "<#00bfff>(⎈|{{ .Context }}{{ if .Namespace }}:{{ .Namespace }}{{ end }})</>"
      - type: executiontime
        style: plain
        foreground: "#87ceeb"
        template: "<#87ceeb>-{{ .FormattedMs }}</>"
        properties:
          threshold: 1
          style: austin
      - type: time
        style: plain
        foreground: "#dda0dd"
        template: "<#dda0dd>-{{ .CurrentDate | date \"15:04:05\" }}-</>"
    type: prompt
  - alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: "#dda0dd"
        template: "`--> "
    type: prompt
